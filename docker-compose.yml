services:
  db:
    image: pgvector/pgvector:pg18
    container_name: postgres-spring-boot
    environment:
      POSTGRES_DB: interestingbooks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5332:5432"
    volumes:
      - db:/var/lib/postgresql
    restart: unless-stopped

volumes:
  db: